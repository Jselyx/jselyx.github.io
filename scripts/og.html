<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/unbounded/index.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/onest/index.css" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #cdeda3;
        color: #354e16;
        font-family: 'Onest Variable', system-ui, sans-serif;
        position: relative;
        padding: 72px 76px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .blob-a,
      .blob-b {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.8;
      }
      .blob-a { width: 620px; height: 380px; background: #bcece7; right: -140px; top: -120px; }
      .blob-b { width: 460px; height: 300px; background: #f9faef; left: -120px; bottom: -140px; }
      .chip {
        position: relative;
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px 12px 18px;
        border-radius: 999px;
        background: #f9faef;
        color: #1a1c16;
        font-size: 26px;
        font-weight: 600;
      }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #4c662b; }
      .mid { position: relative; }
      h1 {
        font-family: 'Unbounded Variable', sans-serif;
        font-weight: 780;
        font-size: 168px;
        line-height: 0.9;
        letter-spacing: -0.045em;
        margin-left: -6px;
      }
      .sub {
        margin-top: 22px;
        font-size: 38px;
        font-weight: 500;
        color: #354e16;
        opacity: 0.86;
      }
      .foot {
        position: relative;
        display: flex;
        gap: 14px;
        font-size: 24px;
        font-weight: 600;
      }
      .pill { padding: 12px 22px; border-radius: 999px; background: #f9faef; color: #1a1c16; }
      .pill.alt { background: #4c662b; color: #fff; }
      .art {
        position: absolute;
        right: 72px;
        top: 50%;
        width: 360px;
        height: 360px;
        margin-top: -196px;
        border-radius: 50%;
        overflow: hidden;
        transform: rotate(-6deg);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.22);
      }
      .art img { width: 100%; height: 100%; object-fit: cover; }
      .tag {
        position: absolute;
        right: 96px;
        bottom: 78px;
        padding: 14px 26px;
        border-radius: 999px;
        background: #354e16;
        color: #cdeda3;
        font-family: 'Unbounded Variable', sans-serif;
        font-weight: 700;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <span class="blob-a"></span>
    <span class="blob-b"></span>

    <p class="chip"><span class="dot"></span>Rust-разработчик · Jun+</p>

    <div class="mid">
      <h1>Jselyx</h1>
      <p class="sub">Rust · Flutter · Tauri</p>
    </div>

    <div class="foot">
      <span class="pill">github.com/Jselyx</span>
      <span class="pill alt">t.me/Accelerator3278</span>
    </div>

    <div class="art"><img src="/src/assets/art-1.jpg" alt="" /></div>
    <span class="tag">&lt;/&gt;</span>
  </body>
</html>
